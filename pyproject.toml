# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[build-system]
requires = [
    "setuptools >= 78.1.1,< 82",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "zope.app.container"
version = "6.1.dev0"
description = "Zope Container"
license = "ZPL-2.1"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Framework :: Zope :: 3",
]
dynamic = ["readme"]
requires-python = ">=3.11"
authors = [
    {name = "Zope Foundation and contributors",email = "zope-dev@zope.dev"},
]
maintainers = [
    {name = "Plone Foundation and contributors",email = "zope-dev@zope.dev"},
]
dependencies = [
    "zope.browser",
    "zope.browsermenu",
    "zope.browserpage",
    "zope.component",
    "zope.container",
    "zope.copypastemove",
    "zope.dublincore >= 3.7",
    "zope.event",
    "zope.exceptions",
    "zope.i18n",
    "zope.i18nmessageid",
    "zope.interface",
    "zope.lifecycleevent",
    "zope.location",
    "zope.publisher >= 4.3.1",
    "zope.security >= 4.1.0",
    "zope.size",
    "zope.traversing",
]
keywords = ["zope3", "container"]

[project.optional-dependencies]
test = [
    "zope.app.appsetup",
    "zope.app.basicskin >= 4.0",
    "zope.app.content",
    "zope.app.dependable >= 4.0",
    "zope.app.http",
    "zope.app.pagetemplate >= 4.0",
    "zope.app.principalannotation",
    "zope.app.publication",
    "zope.app.publisher",
    "zope.app.security",
    "zope.app.testing",
    "zope.app.wsgi",
    "zope.applicationcontrol",
    "zope.browser",
    "zope.browserresource",
    "zope.copypastemove",
    "zope.login",
    "zope.password",
    "zope.principalannotation",
    "zope.principalregistry",
    "zope.proxy >= 4.2.1",
    "zope.securitypolicy",
    "zope.site",
    "zope.testbrowser>5",
    "zope.testing",
    "zope.testrunner >= 6.4",
]

[project.urls]
Source = "http://github.com/zopefoundation/zope.app.container"
Issues = "https://github.com/zopefoundation/zope.app.container/issues"
Changelog = "https://raw.githubusercontent.com/zopefoundation/zope.app.container/master/CHANGES.rst"

[tool.coverage.run]
branch = true
source = ["zope.app.container"]

[tool.coverage.report]
fail_under = 90
precision = 2
ignore_errors = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "self.fail",
    "raise AssertionError",
    "raise unittest.Skip",
]

[tool.coverage.html]
directory = "parts/htmlcov"

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"]}

[tool.zest-releaser]
create-wheel = false
extra-message = ""
upload-pypi = false
